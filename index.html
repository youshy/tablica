<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tablica 3D</title>
<style>
  :root { --bg-top: #f4f2ee; --bg-bottom: #d9d5cd; --ink: #1d1d1f; --btn: rgba(255,255,255,.85); }
  @media (prefers-color-scheme: dark) {
    :root { --bg-top: #2a2a2e; --bg-bottom: #0f0f11; --ink: #f2f2f2; --btn: rgba(40,40,44,.85); }
  }
  html, body { margin: 0; height: 100%; overflow: hidden; font: 14px/1.4 system-ui, sans-serif; color: var(--ink);
    background: radial-gradient(ellipse at 50% 35%, var(--bg-top), var(--bg-bottom)); }
  canvas { display: block; touch-action: none; }
  #ui { position: fixed; left: 16px; right: 16px; bottom: 16px; display: flex; gap: 12px; align-items: center;
    justify-content: space-between; flex-wrap: wrap; pointer-events: none; }
  #hint { opacity: .7; }
  #tools { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; pointer-events: auto; }
  #tools > span { display: contents; }
  #ui button { pointer-events: auto; border: 0; border-radius: 999px; padding: 10px 18px; font: inherit; color: inherit;
    white-space: nowrap; background: var(--btn); box-shadow: 0 2px 10px rgba(0,0,0,.15); cursor: pointer; }
  #ui button[aria-pressed="true"] { outline: 2px solid #3b82f6; }
  #bg-pick { width: 38px; height: 38px; padding: 0; border: 0; border-radius: 50%; background: none; cursor: pointer; }
  #cube { position: fixed; top: 16px; right: 16px; cursor: pointer; }
  #msg { position: fixed; inset: 0; display: grid; place-items: center; text-align: center; padding: 16px; }
</style>
</head>
<body>
<div id="msg">Wczytywanie modelu 3D…<br><small>Do działania biblioteki 3D wymagane jest połączenie z internetem.</small></div>
<div id="ui">
  <span id="hint">Przeciągnij, aby obrócić · Prawy przycisk – przesuń · Kółko / gest szczypania – przybliż</span>
  <div id="tools">
    <span role="group" aria-label="Tło">
      <button type="button" data-bg="" aria-pressed="true">Auto</button>
      <button type="button" data-bg="radial-gradient(ellipse at 50% 35%, #2a2a2e, #0f0f11)">Gradient</button>
      <button type="button" data-bg="#000000">Czarne tło</button>
      <button type="button" data-bg="#ffffff">Białe tło</button>
    </span>
    <input id="bg-pick" type="color" value="#7a8a99" aria-label="Własny kolor tła" title="Własny kolor tła">
    <button id="reset" type="button">Resetuj widok</button>
  </div>
</div>

<script src="photo.js"></script>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { TrackballControls } from 'three/addons/controls/TrackballControls.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const TILT = THREE.MathUtils.degToRad(30);

// --- renderer / scene / camera ---
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(35, innerWidth / innerHeight, 0.05, 50);
// Keep the horizontal framing on narrow (portrait) screens by widening the vertical FOV.
function fitCamera() {
  const aspect = innerWidth / innerHeight, BASE = 1.4;
  camera.aspect = aspect;
  camera.fov = aspect < BASE ? THREE.MathUtils.radToDeg(2 * Math.atan(Math.tan(THREE.MathUtils.degToRad(17.5)) * BASE / aspect)) : 35;
  camera.updateProjectionMatrix();
}
fitCamera();

// --- lights ---
const key = new THREE.DirectionalLight(0xffffff, 2.2);
key.position.set(2.5, 4, 3);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = key.shadow.camera.bottom = -1.5;
key.shadow.camera.right = key.shadow.camera.top = 1.5;
key.shadow.radius = 6;
scene.add(key);
const rim = new THREE.DirectionalLight(0xfff1e0, 1.2);
rim.position.set(-3, 2.5, -3);
scene.add(rim);
scene.add(new THREE.HemisphereLight(0xffffff, 0x444444, 0.4));

const ground = new THREE.Mesh(new THREE.PlaneGeometry(10, 10), new THREE.ShadowMaterial({ opacity: 0.25 }));
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

// --- board artwork: drawn on a canvas (heading, two text columns, archive photo, QR) ---
// w, d = board size in metres. Canvas top edge = back of the board.
const TITLE = 'Historia Radiostacji Gdańsk Jelitkowo';
const TEXT = [
  'Stacja Radiowa Gdańsk - Jelitkowo oddana została do eksploatacji w dniu 17 lutego 1924 roku. Miała za zadanie przyspieszyć ruch telegraficzny i wzmocnić konkurencyjność Gdańska.',
  'Była to stacja nadawcza z około 25-35 metrowymi antenami umożliwiającymi zestawianie bezpośrednich połączeń radiowych i radiotelegraficznych na falach średnich z ważniejszymi krajami w Europie. W 1928 roku stacja nadawała do Wielkiej Brytanii, Danii, Finlandii oraz do Łotwy i Estonii.',
  'Rozkazem z dnia 9 lutego 1961 roku utworzono na jej terenie 6 Ośrodek Przeciwdziałania Radioelektronicznego. Początkowo całą jednostkę ulokowano w budynku po przedwojennej stacji radiowo-nadawczej, później w tym budynku pozostało tylko Centrum Radiowe, którego głównym celem było rozpoznawanie sił potencjalnych przeciwników.',
];
const PHOTO = new Image();
PHOTO.src = window.JELITKOWO_PHOTO; // embedded data URL (photo.js) so file:// doesn't taint the canvas
await PHOTO.decode();

function boardTexture(w, d) {
  const W = 2048, H = Math.round(W * d / w), R = Math.random, c = document.createElement('canvas');
  c.width = W; c.height = H;
  const g = c.getContext('2d');
  g.fillStyle = '#0b0b0c'; g.fillRect(0, 0, W, H);
  g.fillStyle = '#f2f2f2';

  // Greedy word wrap of all paragraphs at a font size; '' = blank line between paragraphs.
  const wrap = (size, maxW) => {
    g.font = `${size}px Georgia, serif`;
    const lines = [];
    for (const p of TEXT) {
      let line = '';
      for (const word of p.split(/\s+/)) {
        const t = line ? line + ' ' + word : word;
        if (line && g.measureText(t).width > maxW) { lines.push(line); line = word; } else line = t;
      }
      lines.push(line, '');
    }
    lines.pop();
    return lines;
  };

  const m = 0.1 * W; // side margin, keeps text clear of the corner bolts
  g.textAlign = 'center'; g.textBaseline = 'alphabetic';
  g.font = `600 ${H * 0.06}px Georgia, serif`; g.fillText(TITLE, W / 2, H * 0.12);
  g.fillRect(m, H * 0.165, W - 2 * m, 2);

  // Two columns either side of the photo; shrink the font until the text fits, then split it evenly.
  const top = H * 0.22, bottom = H * 0.82, colW = 0.23 * W;
  let size = H * 0.034, lines;
  while ((lines = wrap(size, colW)).length > 2 * Math.floor((bottom - top) / (size * 1.35))) size *= 0.96;
  const half = Math.ceil(lines.length / 2);
  g.textAlign = 'left'; g.textBaseline = 'top';
  [lines.slice(0, half), lines.slice(half)].forEach((col, k) => {
    if (col[0] === '') col.shift(); // don't start a column with a paragraph gap
    col.forEach((l, i) => g.fillText(l, k ? 0.67 * W : m, top + i * size * 1.35));
  });

  // Middle: archive photo of the station, keeping its aspect ratio.
  const x0 = 0.36 * W, pw = 0.28 * W, ph = pw * PHOTO.height / PHOTO.width, y0 = top;
  g.drawImage(PHOTO, x0, y0, pw, ph);
  g.textAlign = 'center'; g.textBaseline = 'alphabetic';
  g.font = `italic ${H * 0.026}px Georgia, serif`; g.fillText('Stacja Radiowa Gdańsk - Jelitkowo', W / 2, y0 + ph + H * 0.045);

  // Bottom row: QR code + label, centred.
  const by = H * 0.9;
  const q = H * 0.08, n = 21, s = q / n, qx = 0.46 * W, qy = by - q / 2;
  g.fillStyle = '#f2f2f2'; g.fillRect(qx - s, qy - s, q + 2 * s, q + 2 * s);
  g.fillStyle = '#0b0b0c';
  for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) {
    const fi = i < 7 ? i : i >= n - 7 ? i - (n - 7) : -1, fj = j < 7 ? j : j >= n - 7 ? j - (n - 7) : -1;
    const finder = fi >= 0 && fj >= 0 && !(i >= n - 7 && j >= n - 7); // 3 corner squares
    if (finder ? Math.max(Math.abs(fi - 3), Math.abs(fj - 3)) !== 2 : R() < 0.5) g.fillRect(qx + i * s, qy + j * s, s + 0.5, s + 0.5);
  }
  g.fillStyle = '#f2f2f2'; g.textAlign = 'left'; g.textBaseline = 'middle'; g.font = `${H * 0.026}px Georgia, serif`;
  g.fillText('dołącz do grupy', qx + q + 24, by);

  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return t;
}

// --- materials ---
const black = new THREE.MeshStandardMaterial({ color: 0x0b0b0c, roughness: 0.4, metalness: 0.1, envMapIntensity: 0.35 });
const steel = new THREE.MeshStandardMaterial({ color: 0xd8d8dc, roughness: 0.18, metalness: 1 });

// Corten (weathering steel): procedural rust mottling. Extrude UVs are in metres, so one 1024px tile ≈ 1 m.
// ponytail: random blobs, swap for a photo texture if it needs to look exact.
function cortenTexture() {
  const S = 1024, c = document.createElement('canvas');
  c.width = c.height = S;
  const g = c.getContext('2d');
  const R = Math.random, rust = (l, a) => `hsla(${15 + R() * 12},${50 + R() * 25}%,${l}%,${a})`;
  // Draw at 4 offsets so marks crossing an edge reappear on the opposite side (seamless tile).
  const wrapped = (draw) => { for (const ox of [0, -S]) for (const oy of [0, -S]) draw(ox, oy); };
  g.fillStyle = '#6e3518'; g.fillRect(0, 0, S, S);
  for (let i = 0; i < 300; i++) { // broad soft patina
    const x = R() * S, y = R() * S, r = 30 + R() * 120;
    g.fillStyle = rust(12 + R() * 25, 0.05);
    wrapped((ox, oy) => { g.beginPath(); g.arc(x + ox, y + oy, r, 0, 7); g.fill(); });
  }
  // Run streaks along canvas x = world vertical on the leg (extrude side-wall UV u = height).
  for (let i = 0; i < 1500; i++) {
    const x = R() * S, y = R() * S, len = 40 + R() * 400, h = 1 + R() * 3;
    g.fillStyle = rust(10 + R() * 30, 0.03 + R() * 0.06);
    wrapped((ox, oy) => g.fillRect(x + ox, y + oy, len, h));
  }
  for (let i = 0; i < 40000; i++) { // fine pitting
    const x = R() * S, y = R() * S, r = 0.5 + R() * 1.8;
    g.fillStyle = rust(8 + R() * 35, 0.15 + R() * 0.3);
    wrapped((ox, oy) => { g.beginPath(); g.arc(x + ox, y + oy, r, 0, 7); g.fill(); });
  }
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return t;
}
const corten = new THREE.MeshStandardMaterial({ map: cortenTexture(), roughness: 0.9, metalness: 0.15, envMapIntensity: 0.6 });

const shadowed = (m) => { m.castShadow = m.receiveShadow = true; return m; };

// --- model: one bent sheet in an S profile, side view (z = toward reader, y = up):
// straight vertical leg -> bends forward -> curls back over into the reading plate sloping up to the back.
const model = new THREE.Group();
scene.add(model);

const SHEET_W = 0.70, SHEET_T = 0.008;  // leg and plate share the sheet's width
const LEG_H = 0.80;                     // straight part of the leg
const BEND_R = 0.20, BEND_DEG = 40;     // forward bend at the top of the leg
const CURL_R = 0.035;                   // tight fold where the sheet turns back into the plate
const PLATE_D = 0.38;                   // plate length along its slope
const Z0 = 0.12;                        // leg's z, shifts the footprint so the model spins around its middle

// Turtle walk along the sheet's centreline: [length, total turn in degrees (+ = toward the back)].
// Heading (from +z) goes 90° (up) -> 90-BEND (forward bend) -> 180-TILT (plate rising to the back).
const deg = THREE.MathUtils.degToRad;
const CURL_DEG = 90 + BEND_DEG - THREE.MathUtils.radToDeg(TILT);
const SEGMENTS = [
  [BEND_R * deg(BEND_DEG), -BEND_DEG],
  [CURL_R * deg(CURL_DEG), CURL_DEG],
  [PLATE_D, 0],
];
const centre = [], normals = [];
{
  let z = Z0, y = LEG_H, a = Math.PI / 2;
  const push = () => { centre.push([z, y]); normals.push([Math.sin(a), -Math.cos(a)]); }; // normal = front/top side
  push();
  for (const [len, turn] of SEGMENTS) {
    const n = turn ? 24 : 1;
    for (let i = 0; i < n; i++) {
      a += deg(turn) / n / 2; z += Math.cos(a) * len / n; y += Math.sin(a) * len / n; a += deg(turn) / n / 2;
      push();
    }
  }
}
// Outline = centreline offset by ±T/2, front side out and back side returning.
const sheetShape = new THREE.Shape([
  ...centre.map(([z, y], i) => new THREE.Vector2(z + normals[i][0] * SHEET_T / 2, y + normals[i][1] * SHEET_T / 2)),
  ...centre.map(([z, y], i) => new THREE.Vector2(z - normals[i][0] * SHEET_T / 2, y - normals[i][1] * SHEET_T / 2)).reverse(),
]);
const sheetGeo = new THREE.ExtrudeGeometry(sheetShape, { depth: SHEET_W, bevelEnabled: false, curveSegments: 1 });
sheetGeo.rotateY(-Math.PI / 2);          // shape x -> world z, extrusion -> world -x
sheetGeo.translate(SHEET_W / 2, 0, 0);
model.add(shadowed(new THREE.Mesh(sheetGeo, corten)));

// Straight leg, extruded front-to-back from its front outline so the emblem can be cut through it.
// Emblem: crown over two crosses, right of centre. Stencil-style: the balls are separate holes so every
// piece stays attached to the sheet. Tune EMB_X / EMB_Y / EMB_S to move or resize the whole stack.
const EMB_X = 0.22, EMB_Y = 0.74, EMB_S = 0.07; // centre x, crown centre height, crown width (m)
const legShape = new THREE.Shape([[-SHEET_W / 2, 0], [SHEET_W / 2, 0], [SHEET_W / 2, LEG_H], [-SHEET_W / 2, LEG_H]]
  .map(([x, y]) => new THREE.Vector2(x, y)));
{
  const hole = (pts, dy = 0) => new THREE.Path(pts.map(([x, y]) => new THREE.Vector2(EMB_X + x, EMB_Y + dy + y)));
  const w = EMB_S / 2, h = EMB_S * 0.5, b = h * 0.4, r = EMB_S * 0.09; // half-width, crown height, band height, ball radius
  legShape.holes.push(hole([[-w, -h / 2], [w, -h / 2], [w, h / 2], [w / 2, -h / 2 + b], [0, h / 2], [-w / 2, -h / 2 + b], [-w, h / 2]]));
  for (const x of [-w * 0.9, 0, w * 0.9])
    legShape.holes.push(new THREE.Path().absarc(EMB_X + x, EMB_Y + h / 2 + r + 0.003, r, 0, Math.PI * 2));
  const a = EMB_S * 0.32, t = EMB_S * 0.11; // cross arm half-length, half-thickness
  const cross = [[-t, -a], [t, -a], [t, -t], [a, -t], [a, t], [t, t], [t, a], [-t, a], [-t, t], [-a, t], [-a, -t], [-t, -t]];
  for (const dy of [-EMB_S * 1.1, -EMB_S * 2.05]) legShape.holes.push(hole(cross, dy));
}
const legGeo = new THREE.ExtrudeGeometry(legShape, { depth: SHEET_T, bevelEnabled: false, curveSegments: 16 });
legGeo.translate(0, 0, Z0 - SHEET_T / 2);
// Match the bent part's corten UVs (u = height, v = 1 - extrude depth) so the rust streaks run on across the seam.
const legUV = legGeo.attributes.uv;
for (let i = 0; i < legUV.count; i++) legUV.setXY(i, legUV.getY(i), legUV.getX(i) + 1 - SHEET_W / 2);
model.add(shadowed(new THREE.Mesh(legGeo, corten)));

// Reading-plate frame: origin on the plate's top surface where the curl ends, extends toward local -z.
const [pz, py] = centre[centre.length - 2], [nz, ny] = normals[centre.length - 2];
const top = new THREE.Group();
top.position.set(0, py + ny * SHEET_T / 2, pz + nz * SHEET_T / 2);
top.rotation.x = TILT; // back (-z) rises, front faces the reader
model.add(top);

// Info board floated on 4 steel standoffs; its edges sit INSET_X / INSET_D (fraction of the plate's size) in from the plate edges.
const INSET_X = 0.10, INSET_D = 0.10;
const PAN_W = SHEET_W * (1 - 2 * INSET_X), PAN_D = PLATE_D * (1 - 2 * INSET_D);
const PAN_T = 0.006, PAN_GAP = 0.012;
const PAN_Z = -PLATE_D / 2;
const panel = shadowed(new THREE.Mesh(new THREE.BoxGeometry(PAN_W, PAN_T, PAN_D), black));
panel.position.set(0, PAN_GAP + PAN_T / 2, PAN_Z);
top.add(panel);

const face = new THREE.Mesh(new THREE.PlaneGeometry(PAN_W, PAN_D),
  new THREE.MeshStandardMaterial({ map: boardTexture(PAN_W, PAN_D), roughness: 0.92, metalness: 0, envMapIntensity: 0.15 }));
face.geometry.rotateX(-Math.PI / 2);
face.position.set(0, PAN_GAP + PAN_T + 0.0005, PAN_Z);
top.add(face);

const boltGeo = new THREE.CylinderGeometry(0.014, 0.014, PAN_GAP + PAN_T + 0.006, 24);
for (const sx of [-1, 1]) for (const sz of [-1, 1]) {
  const bolt = shadowed(new THREE.Mesh(boltGeo, steel));
  bolt.position.set(sx * (PAN_W / 2 - 0.03), (PAN_GAP + PAN_T + 0.006) / 2, PAN_Z + sz * (PAN_D / 2 - 0.03));
  top.add(bolt);
}

// --- controls ---
const HOME = { pos: new THREE.Vector3(1.2, 1.3, 2.0), target: new THREE.Vector3(0, 0.6, 0), up: new THREE.Vector3(0, 1, 0) };
const controls = new TrackballControls(camera, renderer.domElement);
controls.rotateSpeed = 3;
controls.zoomSpeed = 1.2;
controls.panSpeed = 0.8;
controls.dynamicDampingFactor = 0.12;
controls.minDistance = 0.8;
controls.maxDistance = 8;

let idle = true;
controls.addEventListener('start', () => { idle = false; });

function reset() {
  camera.position.copy(HOME.pos);
  camera.up.copy(HOME.up);
  controls.target.copy(HOME.target);
  model.rotation.set(0, 0, 0);
  camera.lookAt(HOME.target);
  controls.update();
}
reset();
document.getElementById('reset').addEventListener('click', reset);

addEventListener('resize', () => {
  fitCamera();
  renderer.setSize(innerWidth, innerHeight);
  controls.handleResize();
});

// --- view cube: click a face, edge or corner to snap the camera (26 directions) ---
// View cube scales with the viewport: 15% of the shorter side, clamped to 80–200 CSS px. Tune here.
const cubeSize = () => Math.round(Math.min(200, Math.max(80, 0.15 * Math.min(innerWidth, innerHeight))));
const cubeRenderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
cubeRenderer.setPixelRatio(Math.min(devicePixelRatio, 2));
cubeRenderer.setSize(cubeSize(), cubeSize());
addEventListener('resize', () => cubeRenderer.setSize(cubeSize(), cubeSize()));
cubeRenderer.domElement.id = 'cube';
cubeRenderer.domElement.title = 'Kliknij ścianę, krawędź lub narożnik, aby ustawić widok';
document.body.append(cubeRenderer.domElement);

const cubeScene = new THREE.Scene();
const cubeCam = new THREE.PerspectiveCamera(30, 1, 0.1, 10);

function faceTexture(label) {
  const S = 512, c = document.createElement('canvas');
  c.width = c.height = S;
  const g = c.getContext('2d');
  const grad = g.createLinearGradient(0, 0, 0, S);
  grad.addColorStop(0, '#f7f6f3'); grad.addColorStop(1, '#e2dfd8');
  g.fillStyle = grad; g.fillRect(0, 0, S, S);
  g.strokeStyle = 'rgba(0,0,0,.08)'; g.lineWidth = 4; // hints at the edge/corner click zones
  for (const t of [0.2 * S, 0.8 * S]) { g.beginPath(); g.moveTo(t, 0); g.lineTo(t, S); g.moveTo(0, t); g.lineTo(S, t); g.stroke(); }
  g.fillStyle = '#3a3a3e'; g.font = '600 100px system-ui, sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillText(label, S / 2, S / 2);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
// BoxGeometry material order: +x, -x, +y, -y, +z, -z
// RoundedBoxGeometry keeps BoxGeometry's 6 material groups and per-face UVs.
const navCube = new THREE.Mesh(new RoundedBoxGeometry(1, 1, 1, 6, 0.1),
  ['PRAWO', 'LEWO', 'GÓRA', 'DÓŁ', 'PRZÓD', 'TYŁ'].map((l) => new THREE.MeshLambertMaterial({ map: faceTexture(l) })));
cubeScene.add(navCube);
// Light rides with the cube camera so the rounded edges always catch a soft highlight.
cubeScene.add(new THREE.AmbientLight(0xffffff, 1.15));
const cubeLight = new THREE.DirectionalLight(0xffffff, 0.9);
cubeLight.position.set(-1, 2, 3);
cubeCam.add(cubeLight);
cubeScene.add(cubeCam);

const hover = new THREE.Mesh(new RoundedBoxGeometry(1, 1, 1, 2, 0.1),
  new THREE.MeshBasicMaterial({ color: 0x3b82f6, transparent: true, opacity: 0.55 }));
hover.visible = false;
cubeScene.add(hover);

// Hit point on the cube surface -> direction with components in {-1, 0, 1}.
// ponytail: outer 20% band of each face = edge/corner zone, matches the grid lines drawn on the faces.
const ZONE = 0.3;
function pickDir(e) {
  const r = cubeRenderer.domElement.getBoundingClientRect();
  const ndc = new THREE.Vector2(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
  const ray = new THREE.Raycaster();
  ray.setFromCamera(ndc, cubeCam);
  const hit = ray.intersectObject(navCube, false)[0];
  if (!hit) return null;
  return hit.point.toArray().map((v) => (Math.abs(v) > ZONE ? Math.sign(v) : 0));
}

cubeRenderer.domElement.addEventListener('pointermove', (e) => {
  const d = pickDir(e);
  hover.visible = !!d;
  if (!d) return;
  hover.scale.set(...d.map((v) => (v ? 0.22 : 0.62)));
  hover.position.set(...d.map((v) => v * 0.405));
});
cubeRenderer.domElement.addEventListener('pointerleave', () => { hover.visible = false; });
cubeRenderer.domElement.addEventListener('click', (e) => { const d = pickDir(e); if (d) snapTo(d); });

let anim = null; // { from: Quaternion, to: Quaternion, dist, t }
function snapTo(d) {
  idle = false;
  model.rotation.set(0, 0, 0);
  const dir = new THREE.Vector3(...d).normalize();
  // Top/bottom look straight along Y, so "up" on screen is the lectern's back/front.
  const up = d[0] === 0 && d[2] === 0 ? new THREE.Vector3(0, 0, -d[1]) : new THREE.Vector3(0, 1, 0);
  const dist = camera.position.distanceTo(controls.target);
  const m = new THREE.Matrix4().lookAt(dir, new THREE.Vector3(), up);
  anim = { from: camera.quaternion.clone(), to: new THREE.Quaternion().setFromRotationMatrix(m), dist, t: 0 };
}

function stepAnim(dt) {
  anim.t = Math.min(1, anim.t + dt / 0.4);
  const k = 1 - (1 - anim.t) ** 3; // ease-out
  const q = anim.from.clone().slerp(anim.to, k);
  camera.position.copy(controls.target).add(new THREE.Vector3(0, 0, anim.dist).applyQuaternion(q));
  camera.up.set(0, 1, 0).applyQuaternion(q);
  camera.lookAt(controls.target);
  if (anim.t === 1) anim = null;
}

document.getElementById('reset').addEventListener('click', () => { anim = null; });

// --- background switcher: auto (system light/dark gradient), forced dark gradient, black/white, or any picked colour ---
// ponytail: not remembered across reloads, add localStorage if that's wanted.
const bgButtons = document.querySelectorAll('[data-bg]');
function setBg(c) {
  const st = document.body.style;
  st.background = c;
  if (!c) { st.removeProperty('--ink'); st.removeProperty('--btn'); }
  else { // pick text/button colours that stay readable on the chosen background
    const n = parseInt(c.match(/#(\w{6})/)[1], 16), light = 0.299 * (n >> 16) + 0.587 * (n >> 8 & 255) + 0.114 * (n & 255) > 140;
    // gradients are judged by their first colour stop
    st.setProperty('--ink', light ? '#1d1d1f' : '#f2f2f2');
    st.setProperty('--btn', light ? 'rgba(255,255,255,.85)' : 'rgba(40,40,44,.85)');
  }
  bgButtons.forEach((b) => b.setAttribute('aria-pressed', b.dataset.bg === c));
}
bgButtons.forEach((b) => b.addEventListener('click', () => setBg(b.dataset.bg)));
document.getElementById('bg-pick').addEventListener('input', (e) => setBg(e.target.value));

document.getElementById('msg').remove();

const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = clock.getDelta();
  if (idle) model.rotation.y += dt * 0.25;
  controls.update();
  if (anim) stepAnim(dt); // after controls.update so leftover trackball momentum can't fight the snap
  renderer.render(scene, camera);

  // Cube mirrors the main camera's orientation (cube is fixed in world axes).
  cubeCam.position.copy(camera.position).sub(controls.target).setLength(3.6);
  cubeCam.up.copy(camera.up);
  cubeCam.lookAt(0, 0, 0);
  cubeRenderer.render(cubeScene, cubeCam);
});

window.lectern = { camera, controls, model, reset, snapTo };
</script>
</body>
</html>
